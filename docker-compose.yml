services:
  lightrag:
    build:
      context: .
      dockerfile: Dockerfile.lightrag
    ports:
      - "${LIGHTRAG_PORT:-9621}:9621"
    volumes:
      - ./data/lightrag:/app/data/rag_storage
      - ./data/lightrag_inputs:/app/data/inputs   
    env_file: .env
    depends_on:
      tei:
        condition: service_healthy
      vllm-reranker:
        condition: service_started
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9621/health').status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5

  gigachat-adapter:
    image: antonk0/gigachat-adapter:latest
    environment:
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS}
      BEARER_TOKEN: ${GIGACHAT_ADAPTER_BEARER_TOKEN}
      GIGACHAT_VERIFY_SSL_CERTS: "False"
      timeout: 360
    ports:
      - "8081:8000"
  # GPU
  tei:
      image: ghcr.io/huggingface/text-embeddings-inference:latest
      command: >
        --model-id Qwen/Qwen3-Embedding-0.6B
        --auto-truncate 
        --max-batch-tokens 2048
        --max-concurrent-requests 2
      ports:
        - "${TEI_PORT}:80"
      volumes:
        - ./data/tei_data:/data
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: 1
                capabilities: [gpu]
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
        interval: 15s
        timeout: 10s
        retries: 10

  # Второй TEI на дообученном biencoder-чекпоинте (training/biencoder_output/final),
  # для честного IR-eval дообученных эмбеддингов без трогания прод-коллекции
  # warhammer_wiki (см. app/eval/compare_configs.py, сценарий finetuned-embeddings).
  # Не входит в core-стек make up — поднимается отдельно: docker compose up -d tei-finetuned.
  tei-finetuned:
      # GPU здесь не работает и упирается в тупик версий, не просто в конфиг:
      # :latest/:86-latest бандлят cuda-compat (forward-compat shim), который
      # NVIDIA не поддерживает на GeForce (только datacenter-карты) — падает
      # с CUDA_ERROR_COMPAT_NOT_SUPPORTED_ON_DEVICE и тихо откатывается на CPU
      # (тот же баг у основного `tei` — см. его логи, тоже незаметно на CPU,
      # там просто хватает CPU для одиночных query-эмбеддингов). Более старый
      # версионный тег для этой архитектуры (86-1.2, до появления bundled
      # entrypoint.sh с compat-трюком) собран под CUDA без этой проблемы, но
      # не умеет парсить config.json современных моделей вроде Qwen3 (вышел
      # до её поддержки в TEI) — падает на "invalid type: null, expected usize".
      # Итог: нет версии, которая одновременно новая для модели и старая для
      # драйвера. Остаёмся на :latest + CPU (функционально работает, медленно).
      image: ghcr.io/huggingface/text-embeddings-inference:latest
      command: >
        --model-id /data/biencoder_finetuned
        --auto-truncate
        --max-batch-tokens 2048
        --max-concurrent-requests 2
      ports:
        - "8082:80"
      volumes:
        - ./training/biencoder_output/final:/data/biencoder_finetuned:ro
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: 1
                capabilities: [gpu]
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
        interval: 15s
        timeout: 10s
        retries: 10

  # CPU
  # tei:
  #   image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
  #   command: >
  #     --model-id onnx-community/Qwen3-Embedding-0.6B-ONNX
  #     --pooling last-token
  #     --auto-truncate 
  #     --max-batch-tokens 2048
  #   ports:
  #     - "${TEI_PORT}:80"
  #   volumes:
  #     - ./data/tei_data_cpu:/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
  #     interval: 15s
  #     retries: 10

  vllm-reranker:
      # Пин на последний релиз с CUDA 12.9 (v0.20.0+ перешёл на CUDA 13.0.2,
      # несовместимую с драйвером хоста 535.309.01 / CUDA 12.2 — см. RuntimeError
      # "The NVIDIA driver on your system is too old" при :latest)
      # gpu-memory-utilization снижен с 0.6 до 0.2 (26.07) — нужно делить карту с vllm-llm
      # (генерация, Qwen3-4B-AWQ, ~3.7GB) для полностью локального пайплайна. Кросс-энкодер
      # без автогенерации/растущего KV-cache не требует много — 0.6 было наследием периода,
      # когда reranker был единственным GPU-сервисом на карте.
      image: vllm/vllm-openai:v0.19.1
      container_name: vllm-reranker
      environment:
        - CUDA_VISIBLE_DEVICES=0
        - LD_LIBRARY_PATH=/usr/local/nvidia/lib64:/usr/local/nvidia/lib:/usr/lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu  # ← КЛЮЧЕВОЙ ФИКС
        # "CUDA unknown error ... changing env variable CUDA_VISIBLE_DEVICES
        # after program start" при default (fork): CUDA-контекст, тронутый в
        # родительском API-server процессе, не переживает fork в EngineCore.
        # spawn пересоздаёт процесс с чистого листа.
        - VLLM_WORKER_MULTIPROC_METHOD=spawn
      command: >-
        BAAI/bge-reranker-v2-m3
        --runner pooling
        --trust-remote-code
        --host 0.0.0.0
        --port 8000
        --served-model-name bge-reranker-v2-m3
        --max-model-len 2024
        --gpu-memory-utilization 0.2
        --dtype bfloat16
        --enforce-eager
      ports:
        - "8001:8000"
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: 1
                capabilities: [gpu]
      volumes:
        - ./data/vllm_cache:/root/.cache/huggingface
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
        interval: 15s
        timeout: 10s
        retries: 5
      restart: unless-stopped

  # Self-hosted генерация через vLLM — учебный эксперимент (training/vllm_inference_deepdive.ipynb),
  # закрывает рыночный гэп из learning_goals.md (vLLM/квантизация встретились в 3 вакансиях).
  # НЕ входит в core-стек make up, модель НЕ скачана по умолчанию — поднимать явно:
  #   docker compose stop vllm-reranker   # 6GB VRAM на карте, обе модели разом не влезут
  #   docker compose up -d vllm-llm       # первый запуск скачает веса с HuggingFace
  # Версия образа и env — те же грабли, что уже нашли на vllm-reranker (см. его комментарии выше):
  # :latest уезжает на несовместимую с драйвером хоста CUDA, spawn обязателен для CUDA_VISIBLE_DEVICES.
  # max-model-len 3072, gpu-memory-utilization 0.68 (26.07, пересчитано под реальные данные):
  # RERANKER_TOP_K=5 чанков (данные — 59106 чанков, chunk_size=1000, реально p90=1031 симв
  # ≈319 токенов) + системный промпт (1088 симв ≈337 токенов) в худшем случае (5 чанков около
  # максимума 1432 симв) дают ~2450 токенов ВХОДА — 2048 гарантированно резал такие вопросы
  # (см. живой прогон: 2/10 реальных вопросов упали на "input_tokens exceeds max"). 3072 с
  # запасом покрывает p90-сценарий + фиксированный вывод. Раньше падало на 4096 при utilization
  # 0.6 ("Available KV cache memory: 0.38 GiB" против нужных 0.56 GiB) — подняли utilization до
  # 0.68, проверено эмпирически совместно с vllm-reranker (0.2) на этой же карте, не крэшит.
  vllm-llm:
      image: vllm/vllm-openai:v0.19.1
      container_name: vllm-llm
      environment:
        - CUDA_VISIBLE_DEVICES=0
        - LD_LIBRARY_PATH=/usr/local/nvidia/lib64:/usr/local/nvidia/lib:/usr/lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu
        - VLLM_WORKER_MULTIPROC_METHOD=spawn
      command: >-
        Qwen/Qwen3-4B-AWQ
        --served-model-name Qwen/Qwen3-4B-AWQ
        --quantization awq_marlin
        --host 0.0.0.0
        --port 8000
        --max-model-len 3072
        --gpu-memory-utilization 0.68
        --enforce-eager
      ports:
        - "8003:8000"
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: 1
                capabilities: [gpu]
      volumes:
        - ./data/vllm_cache:/root/.cache/huggingface
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
        interval: 15s
        timeout: 10s
        retries: 5
      restart: unless-stopped

  # Эксперимент (26.07): TEI не может отдать финетюненный биэнкодер на GPU на этой карте
  # (см. комментарий tei-finetuned выше — cuda-compat shim не поддерживается на GeForce).
  # vLLM --runner pooling — тот же трюк, что уже используется для vllm-reranker, но для
  # чистого эмбеддинг-чекпоинта (Qwen3Model, training/biencoder_output/final). НЕ входит
  # в core-стек — поднимать явно: docker compose up -d vllm-biencoder.
  vllm-biencoder:
      image: vllm/vllm-openai:v0.19.1
      container_name: vllm-biencoder
      environment:
        - CUDA_VISIBLE_DEVICES=0
        - LD_LIBRARY_PATH=/usr/local/nvidia/lib64:/usr/local/nvidia/lib:/usr/lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu
        - VLLM_WORKER_MULTIPROC_METHOD=spawn
      command: >-
        /data/biencoder_finetuned
        --runner pooling
        --served-model-name biencoder-finetuned
        --host 0.0.0.0
        --port 8000
        --max-model-len 2048
        --gpu-memory-utilization 0.35
        --dtype bfloat16
        --enforce-eager
      ports:
        - "8004:8000"
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: 1
                capabilities: [gpu]
      volumes:
        - ./training/biencoder_output/final:/data/biencoder_finetuned:ro
        - ./data/vllm_cache:/root/.cache/huggingface
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
        interval: 15s
        timeout: 10s
        retries: 5
      restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT}:6333"
    volumes:
      - ./data/qdrant_data:/qdrant/storage:z # :z лечит проблемы с правами в Linux
    healthcheck:
      test: ["CMD-SHELL", "ls /qdrant/storage/raft_state.json || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 10

  # Кэш (Redis)
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    environment:
      - REDIS_CLUSTER_ENABLED=false
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # Основная БД для Langfuse
  langfuse-db:
    image: postgres:16-alpine
    profiles: ["debug"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Аналитическая БД для Langfuse v3
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    profiles: ["debug"]
    environment:
    - CLICKHOUSE_USER=${CH_USER}
    - CLICKHOUSE_PASSWORD=${CH_PASSWORD}
    - CLICKHOUSE_DB=${CH_DB}
    - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  langfuse:
      image: langfuse/langfuse:3
      profiles: ["debug"]
      depends_on:
        langfuse-db: { condition: service_healthy }
        clickhouse: { condition: service_healthy }
        redis: { condition: service_healthy }
        minio: { condition: service_healthy }
      ports:
        - "${LANGFUSE_PORT}:3000"
      environment:
        - NODE_ENV=production
        # Single-node ClickHouse (нет Zookeeper/кластера) — без этого миграции падают на ON CLUSTER
        - CLICKHOUSE_CLUSTER_ENABLED=false
        - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@langfuse-db:5432/${POSTGRES_DB}
        - CLICKHOUSE_URL=http://clickhouse:8123/${CH_DB}
        # Исправлено: используем переменные для миграций
        - CLICKHOUSE_MIGRATION_URL=clickhouse://${CH_USER}:${CH_PASSWORD}@clickhouse:9000/${CH_DB}
        - CLICKHOUSE_USER=${CH_USER}
        - CLICKHOUSE_PASSWORD=${CH_PASSWORD}
        - CLICKHOUSE_DB=${CH_DB}
        - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
        - NEXTAUTH_URL=${NEXTAUTH_URL}
        - ENCRYPTION_KEY=${ENCRYPTION_KEY}
        - SALT=${SALT}
        - REDIS_CONNECTION_STRING=redis://redis:6379/0
        - LANGFUSE_INGESTION_QUEUE_TYPE=redis
        - LANGFUSE_OTEL_INGESTION_QUEUE_TYPE=redis
        - LANGFUSE_ENABLE_WORKER_IN_WEB_CONTAINER=false
        # S3 / Minio
        - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=${LANGFUSE_S3_EVENT_UPLOAD_BUCKET}
        - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID}
        - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY}
        - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
        - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
        - AWS_REGION=${LANGFUSE_S3_EVENT_UPLOAD_REGION:-us-east-1}
        # Локальный вход без SSO
        - AUTH_DISABLE_USERNAME_PASSWORD=${AUTH_DISABLE_USERNAME_PASSWORD:-false}
        - LANGFUSE_INIT_ORG_ID=${LANGFUSE_INIT_ORG_ID:-warhammer}
        - LANGFUSE_INIT_ORG_NAME=${LANGFUSE_INIT_ORG_NAME:-Warhammer Wiki Bot}
        - LANGFUSE_INIT_PROJECT_ID=${LANGFUSE_INIT_PROJECT_ID:-warhammer-rag}
        - LANGFUSE_INIT_PROJECT_NAME=${LANGFUSE_INIT_PROJECT_NAME:-RAG}
        - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
        - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_SECRET_KEY}
        - LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL:-admin@example.com}
        - LANGFUSE_INIT_USER_NAME=${LANGFUSE_INIT_USER_NAME:-admin}
        - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_INIT_USER_PASSWORD:-adminadmin}

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    profiles: ["debug"]
    depends_on:
      langfuse: { condition: service_started }
      redis: { condition: service_healthy }
    environment:
      - NODE_ENV=production
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@langfuse-db:5432/${POSTGRES_DB}
      - CLICKHOUSE_URL=http://clickhouse:8123/${CH_DB}
      - CLICKHOUSE_USER=${CH_USER}
      - CLICKHOUSE_PASSWORD=${CH_PASSWORD}
      - CLICKHOUSE_DB=${CH_DB}
      - REDIS_CONNECTION_STRING=redis://redis:6379/0
      - LANGFUSE_INGESTION_QUEUE_TYPE=redis
      - LANGFUSE_OTEL_INGESTION_QUEUE_TYPE=redis
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=${LANGFUSE_S3_EVENT_UPLOAD_BUCKET}
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - AWS_REGION=${LANGFUSE_S3_EVENT_UPLOAD_REGION:-us-east-1}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SALT=${SALT}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL} # Добавлено для консистентности

  api:
    build: .
    ports:
      - "${API_PORT}:8000"
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      tei:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      vllm-reranker:
        condition: service_started

  # MCP-сервер (streamable-HTTP) → FastAPI /v1/ask, для Claude Desktop/Code
  mcp-server:
    build: .
    command: ["python3", "mcp_server/server.py"]
    ports:
      - "${MCP_PORT:-8010}:8010"
    volumes:
      - .:/app
    env_file: .env
    environment:
      - WARHAMMER_API_URL=http://api:8000
    depends_on:
      - api

  # Chat UI (Chainlit) → FastAPI /v1/ask
  chainlit:
    build: .
    command: >
      chainlit run app/ui/chainlit_app.py
      --host 0.0.0.0
      --port 8501
      -h
    ports:
      - "${CHAINLIT_PORT:-8501}:8501"
    volumes:
      - .:/app
    env_file: .env
    environment:
      - RAG_API_URL=http://api:8000
      - CHAINLIT_ASK_TIMEOUT=90
    depends_on:
      - api

volumes:
  langfuse_db_data:
  clickhouse_data: